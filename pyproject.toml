[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "remoteinput"
version = "0.1.0"
description = "Console mouse and keyboard control through an authenticated TLS relay"
requires-python = ">=3.12"
dependencies = ["websockets==16.0", "certifi==2026.2.25"]

[project.optional-dependencies]
build = ["pyinstaller==6.19.0"]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "cryptography==46.0.5", "ruff==0.15.6"]

[project.scripts]
remoteinput = "remoteinput.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
