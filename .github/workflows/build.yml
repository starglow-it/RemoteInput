name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: python scripts/benchmark.py --output docs/latency-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: latency-ci
          path: docs/latency-ci.json
  packages:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
          - os: macos-15-intel
            name: macOS-Intel
          - os: macos-15
            name: macOS-Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[build,test]"
      - run: python -m pytest -q
      - name: Package the configured app or a clearly marked setup-pending build
        env:
          REMOTEINPUT_RELAY_URL: ${{ vars.REMOTEINPUT_RELAY_URL }}
        run: python scripts/build.py --unconfigured
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteInput-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 30

