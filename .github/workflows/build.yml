name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: python scripts/benchmark.py --output docs/latency-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: latency-ci
          path: docs/latency-ci.json
  packages:
    needs: [checks, relay-deployment]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
          - os: macos-15-intel
            name: macOS-Intel
          - os: macos-15
            name: macOS-Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[build,test]"
      - run: python -m pytest -q
      - name: Package the configured app or a clearly marked setup-pending build
        env:
          REMOTEINPUT_RELAY_URL: ${{ vars.REMOTEINPUT_RELAY_URL || 'wss://172-86-119-204.sslip.io/ws' }}
        run: python scripts/build.py --unconfigured
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteInput-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 30
  relay-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Isolated CI resources, with Caddy's local CA instead of public ACME.
      RELAY_DOMAIN: localhost
      COMPOSE_PROJECT_NAME: remoteinput-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Start the real relay and Caddy deployment
        run: docker compose -f deploy/compose.yaml up -d --build
      - name: Verify HTTPS health, fallback, and WebSocket routing
        run: |
          python - <<'PY'
          import asyncio
          import subprocess
          import tempfile
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import HTTPSHandler, ProxyHandler, build_opener

          from remoteinput.cli import probe
          from remoteinput.config import public_tls_context

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory) / "caddy-test-root.crt"
              deadline = time.monotonic() + 30
              while True:
                  result = subprocess.run(
                      ["docker", "compose", "-f", "deploy/compose.yaml", "cp",
                       "caddy:/data/caddy/pki/authorities/local/root.crt", str(root)],
                      capture_output=True, text=True, timeout=5,
                  )
                  if result.returncode == 0:
                      break
                  if time.monotonic() >= deadline:
                      raise RuntimeError("Caddy did not create the local test CA")
                  time.sleep(.5)

              context = public_tls_context()
              context.load_verify_locations(cafile=str(root))
              opener = build_opener(ProxyHandler({}), HTTPSHandler(context=context))
              deadline = time.monotonic() + 30
              while True:
                  try:
                      with opener.open("https://localhost/health", timeout=2) as response:
                          assert response.status == 200
                          assert response.read() == b"RemoteInput relay"
                      break
                  except (URLError, TimeoutError):
                      if time.monotonic() >= deadline:
                          raise
                      time.sleep(.5)

              try:
                  opener.open("https://localhost/not-a-route", timeout=5)
              except HTTPError as error:
                  assert error.code == 404
                  error.close()
              else:
                  raise AssertionError("An unknown route must return HTTP 404")

              measurements = asyncio.run(probe("wss://localhost/ws", 3, context))
              assert measurements["this_pc_relay_link_rtt"]["samples"] == 3
              print("Deployment check passed: verified TLS, /health=200, fallback=404, /ws relay ready.")
          PY
      - name: Show deployment logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --tail=100
      - name: Remove only this CI run's containers and volumes
        if: always()
        run: docker compose -f deploy/compose.yaml down -v --remove-orphans
